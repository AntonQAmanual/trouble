<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#006B80"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Trouble RedLine</title>
<style>
:root{--bg:#EEF3F4;--card:#fff;--ink:#12232B;--mute:#5B6E76;--line:#D3DEE2;--teal:#006B80;--new:#2F8FB0;--mid:#C98A00;--old:#C0392B;--chip:#E3EDF0}
@media(prefers-color-scheme:dark){:root{--bg:#0E1A20;--card:#15262E;--ink:#E6EEF1;--mute:#8FA3AB;--line:#24383F;--chip:#1F343C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:2;background:var(--teal);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{font-size:17px;margin:0;flex:1;font-weight:650}header small{opacity:.8}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:var(--chip);color:var(--ink);cursor:pointer}
header button{background:rgba(255,255,255,.18);color:#fff}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{max-width:820px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1}
input{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--teal);color:#fff}
.summary{display:flex;gap:16px;align-items:baseline;margin:2px 2px 10px}.summary b{font-size:28px}.summary span{color:var(--mute)}
.card{background:var(--card);border-radius:10px;padding:11px 12px 11px 16px;margin-bottom:8px;position:relative;border:1px solid var(--line)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:10px 0 0 10px;background:var(--rail)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.st{font-weight:650}.age{color:var(--mute);font-size:13px;white-space:nowrap}
.lab{font-weight:600;color:var(--teal);margin:2px 0;word-break:break-word}
@media(prefers-color-scheme:dark){.lab{color:#6CC4DB}}
.txt{white-space:pre-wrap;word-break:break-word;margin:4px 0;max-height:7.4em;overflow:hidden;cursor:pointer}.card.open .txt{max-height:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px}
.card a{color:var(--teal);font-size:14px;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:start;display:block;width:100%}.s b{font-size:22px}.s.z{opacity:.55}.s span{display:block;color:var(--mute);font-size:13px}
.empty,.err{padding:24px 8px;text-align:center;color:var(--mute)}.err{color:var(--old)}
#setup{max-width:460px;margin:8vh auto;padding:16px}#setup label{display:block;margin:12px 0 4px}#setup button{margin-top:16px;background:var(--teal);color:#fff;width:100%}
</style></head><body>
<header><h1>Trouble RedLine <small id="upd"></small></h1><button id="ref" aria-label="Обновить">Обновить</button><button id="cfg" aria-label="Подключение">⚙</button></header>
<div id="setup" hidden>
 <h2>Подключение к таблице</h2><p>Вставьте адрес веб-приложения Apps Script (оканчивается на /exec) и секретный ключ WEB_KEY. Они хранятся только на этом устройстве.</p>
 <label for="u">Адрес /exec</label><input id="u" inputmode="url" autocomplete="off"><label for="k">Ключ</label><input id="k" type="password" autocomplete="off">
 <button id="save">Подключить</button></div>
<main id="app" hidden>
 <div class="tabs"><button data-t="feed" class="on">Открытые</button><button data-t="st">Станции</button></div>
 <div class="bar"><input id="q" type="search" placeholder="Поиск: станция, адрес, номер, текст"><button id="clr" hidden>Все станции</button></div>
 <div id="out"></div></main>
<script>
const $=s=>document.querySelector(s),L=localStorage;let D=null,tab='feed',pick=null,busy=false;
const hp=new URLSearchParams(location.hash.slice(1)),TG=hp.get('tgWebAppData')||'',X=new URLSearchParams(location.search).get('x');
if(X&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(X))L.setItem('tr_u',X);
if(TG){const sc=document.createElement('script');sc.src='https://telegram.org/js/telegram-web-app.js';sc.onload=()=>{try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor('#006B80')}catch(_){}};document.head.appendChild(sc);$('#cfg').hidden=true;}
const cfg=()=>({u:L.getItem('tr_u')||'',k:L.getItem('tr_k')||''});
const days=t=>Math.floor((Date.now()-t)/864e5),rail=d=>d<=2?'var(--new)':d<=7?'var(--mid)':'var(--old)';
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<60?m+' мин':m<1440?Math.floor(m/60)+' ч':Math.floor(m/1440)+' дн'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(){const c=cfg(),ok=TG?c.u:(c.u&&c.k);if(TG&&!c.u){$('#app').hidden=false;$('#out').innerHTML='<div class="err">Откройте приложение кнопкой «Trouble» в чате с ботом.</div>';return}$('#setup').hidden=!!ok;$('#app').hidden=!ok;if(ok)load();}
async function load(){if(busy)return;busy=true;const c=cfg();
 try{const r=await fetch(c.u+'?api=state&'+(TG?'initData='+encodeURIComponent(TG):'key='+encodeURIComponent(c.k))),j=await r.json();
  if(!j.ok)throw new Error(j.error==='auth'?(TG?'Нет доступа: ваш Telegram ID не добавлен в WEB_USER_IDS или INTAKE_USER_IDS.':'Неверный ключ. Проверьте WEB_KEY в свойствах скрипта.'):j.error);
  D=j.data;L.setItem('tr_cache',JSON.stringify(D));$('#upd').textContent=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});render();}
 catch(e){if(!D){try{D=JSON.parse(L.getItem('tr_cache'))}catch(_){}}render(e.message==='Failed to fetch'?'Нет связи с таблицей. Показаны последние сохранённые данные.':e.message);}
 busy=false;}
function render(err){const o=$('#out');if(!D){o.innerHTML='<div class="err">'+esc(err||'Нет данных')+'</div>';return;}
 const q=$('#q').value.trim().toLowerCase(),st=D.stations;$('#clr').hidden=pick===null;
 let h=err?'<div class="err">'+esc(err)+'</div>':'';
 if(tab==='st'){h+='<div class="grid">'+st.map(s=>'<button class="s'+(s.open?'':' z')+'" data-i="'+s.i+'"><b style="color:'+(s.open?'var(--old)':'var(--mute)')+'">'+s.open+'</b><span>'+esc(s.name)+'</span></button>').join('')+'</div>';}
 else{const items=D.items.filter(x=>(pick===null||x.i===pick)&&(!q||(st[x.i].name+' '+x.label+' '+x.text+' '+x.call+' '+x.asr+' '+x.sc).toLowerCase().includes(q)));
  h+='<div class="summary"><b>'+items.length+'</b><span>открытых'+(pick!==null?' · '+esc(st[pick].name):'')+'</span></div>';
  h+=items.length?items.map(x=>{const d=days(x.at);return '<div class="card" style="--rail:'+rail(d)+'"><div class="row"><span class="st">'+esc(st[x.i].name)+'</span><span class="age">'+ago(x.at)+' · #'+esc(x.id)+'</span></div>'+
   (x.label?'<div class="lab" dir="ltr">'+esc(x.label)+'</div>':'')+'<div class="txt" dir="auto">'+esc(x.text)+'</div>'+
   '<div class="chips">'+[['Call',x.call],['ASR',x.asr],['SC',x.sc]].filter(a=>a[1]).map(a=>'<span class="chip">'+a[0]+' '+esc(a[1].replace(/\n/g,', '))+'</span>').join('')+'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">Открыть в таблице</a></div></div>'}).join(''):'<div class="empty">Открытых крий по этому фильтру нет.</div>';}
 o.innerHTML=h;}
$('#out').onclick=e=>{const s=e.target.closest('.s');if(s){pick=+s.dataset.i;tab='feed';sync();render();return}const t=e.target.closest('.txt');if(t)t.parentElement.classList.toggle('open');};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sync();render()});
function sync(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
$('#q').oninput=()=>{if(tab!=='feed'){tab='feed';sync()}render()};$('#clr').onclick=()=>{pick=null;render()};
$('#ref').onclick=load;
$('#save').onclick=()=>{const u=$('#u').value.trim(),k=$('#k').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)||!k){alert('Проверьте адрес (должен оканчиваться на /exec) и ключ.');return}L.setItem('tr_u',u);L.setItem('tr_k',k);D=null;show()};
$('#cfg').onclick=()=>{$('#u').value=cfg().u;$('#k').value='';$('#setup').hidden=false;$('#app').hidden=true};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg().u)load()});setInterval(()=>{if(!document.hidden&&cfg().u)load()},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');show();
</script></body></html>
